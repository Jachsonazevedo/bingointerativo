<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Schola da Mente - Bingo da Mente</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        /* --- Configurações Globais --- */
        :root {
            --gold: #FFD700;
            --gold-dark: #B8860B;
            --royal-blue: #1e3a8a; 
            --royal-dark: #0f172a;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--royal-dark);
            color: white;
            height: 100dvh; 
            width: 100vw;
            overflow: hidden; 
            touch-action: manipulation;
            background-image: radial-gradient(circle at 50% 30%, #172554 0%, #020617 100%);
            -webkit-user-select: none;
            user-select: none;
        }

        .vegas-font { font-family: 'Righteous', cursive; letter-spacing: 1px; }

        /* --- CARTELA GIGANTE E RESPONSIVA --- */
        .cards-wrapper {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 1vmin;
            width: 100%;
            height: 100%;
            padding: 0.5rem; 
        }

        .bingo-card {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: auto repeat(5, 1fr);
            gap: 0.6vmin; 
            
            width: 100%;
            height: auto;
            max-width: 98%; 
            max-height: 98%;
            aspect-ratio: 5 / 6.2;
            
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            padding: 1vmin;
            border-radius: 1rem;
            border: 2px solid var(--gold);
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            transition: all 0.2s;
        }

        /* Se tiver 2 cartelas */
        .cards-container-2 {
            display: flex;
            gap: 2vmin;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
        }
        @media (orientation: portrait) {
            .cards-container-2 { flex-direction: column; }
            .cards-container-2 .bingo-card { max-height: 48%; width: 95%; }
            .bingo-card { width: 96vw; max-width: 500px; }
        }

        /* CABEÇALHO B I N G O */
        .header-cell {
            background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%);
            color: white;
            font-family: 'Righteous', cursive;
            font-size: clamp(1.5rem, 5vmin, 3rem);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.3rem;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* CÉLULAS NÚMEROS - MAXIMIZADAS */
        .num-cell {
            background: #f8fafc;
            color: #0f172a;
            font-weight: 900;
            font-size: clamp(1.8rem, 6.5vmin, 4.5rem); 
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.4rem;
            cursor: pointer;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2);
            transition: transform 0.1s, background-color 0.2s;
        }
        .num-cell:active { transform: scale(0.92); background-color: #e2e8f0; }

        .num-cell.marked {
            background: radial-gradient(circle at 30% 30%, #facc15 0%, #ca8a04 85%);
            color: #422006;
            border: 3px solid #fef08a;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transform: scale(0.98);
        }

        .num-cell.free { background: #cbd5e1; color: #64748b; }
        .num-cell.free.marked { background: radial-gradient(circle, #facc15, #ca8a04); }

        .num-cell.shake { animation: shake 0.4s; background-color: #fca5a5; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

        /* POPUP DE ANSIEDADE */
        .anxiety-popup {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: radial-gradient(circle, #ef4444 0%, #7f1d1d 100%);
            border: 4px solid #facc15;
            padding: 20px;
            border-radius: 20px;
            z-index: 100;
            text-align: center;
            box-shadow: 0 0 50px rgba(239, 68, 68, 0.8);
            pointer-events: none;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .anxiety-popup.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        .anxiety-text {
            font-family: 'Righteous', cursive;
            font-size: 3rem;
            color: white;
            text-shadow: 3px 3px 0 #000;
            line-height: 1;
        }
        .anxiety-sub { color: #fef08a; font-weight: bold; font-size: 1.2rem; margin-top: 5px; }

        /* UI ELEMENTS */
        .ball-hist {
            width: 2.2rem; height: 2.2rem;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            color: #e2e8f0;
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem; font-weight: bold;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .ball-hist.latest {
            width: 2.6rem; height: 2.6rem;
            background: #facc15; color: black;
            border-color: white;
            font-size: 1.3rem;
            box-shadow: 0 0 15px #facc15;
            animation: pulse-gold 1s infinite;
        }
        @keyframes pulse-gold { 50% { box-shadow: 0 0 25px #facc15; } }

        /* BOTÕES */
        .btn-action {
            background: linear-gradient(to bottom, #16a34a, #15803d);
            border-bottom: 4px solid #14532d;
            color: white; font-weight: bold;
            transition: transform 0.1s;
        }
        .btn-action:active { transform: translateY(4px); border-bottom: 0; }
        
        .btn-yellow {
            background: linear-gradient(to bottom, #ca8a04, #a16207);
            border-bottom: 4px solid #713f12;
            color: white;
        }

        .btn-select { background: rgba(255,255,255,0.1); border: 2px solid transparent; color: #cbd5e1; }
        .btn-select.active { background: rgba(0,0,0,0.3); border-color: #facc15; color: white; }

        .modal-bg { background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .alert-text { animation: flash 0.6s infinite alternate; color: #fef08a; }
        @keyframes flash { from { opacity: 1; } to { opacity: 0.6; } }
    </style>
</head>
<body class="h-[100dvh] w-full flex flex-col overflow-hidden">

    <!-- POPUP DE ANSIEDADE -->
    <div id="anxiety-alert" class="anxiety-popup">
        <div class="anxiety-text" id="anxiety-main">FALTA 1!</div>
        <div class="anxiety-sub">A sorte está chegando!</div>
    </div>

    <!-- TELA 1: WELCOME -->
    <section id="screen-welcome" class="flex-grow flex flex-col items-center justify-center p-4 relative z-10 text-center h-full">
        <div class="mb-4 p-4 rounded-full border-4 border-yellow-500 bg-black/40 shadow-lg animate-bounce">
            <i class="fas fa-gem text-5xl text-yellow-400"></i>
        </div>
        <h1 class="text-5xl text-yellow-400 mb-1 vegas-font drop-shadow-md">BINGO</h1>
        <h2 class="text-lg text-blue-200 tracking-widest mb-6 uppercase font-light">Schola da Mente</h2>
        
        <div class="w-full max-w-xs">
            <input type="text" id="inp-name" class="w-full p-3 mb-4 rounded-xl bg-white/10 text-white text-center text-xl border border-white/20 focus:border-yellow-400 outline-none placeholder-blue-300" placeholder="Digite seu nome">
            <button onclick="goConfig()" class="w-full btn-action py-3 rounded-xl text-lg shadow-lg uppercase tracking-wide">ENTRAR</button>
        </div>
    </section>

    <!-- TELA 2: CONFIG -->
    <section id="screen-config" class="hidden flex-col h-full items-center justify-center p-4 overflow-y-auto">
        <div class="w-full max-w-md bg-black/40 border border-white/10 rounded-2xl shadow-2xl p-5 backdrop-blur-md">
            <h2 class="text-2xl text-yellow-400 text-center vegas-font mb-4">CONFIGURAR MESA</h2>
            <div class="space-y-4">
                <!-- Cartelas -->
                <div>
                    <label class="text-blue-300 text-[10px] font-bold uppercase block mb-1">Cartelas</label>
                    <div class="flex gap-2">
                        <button onclick="setCards(1)" class="flex-1 py-3 btn-select rounded-lg font-bold" id="btn-c1">1 CARTELA</button>
                        <button onclick="setCards(2)" class="flex-1 py-3 btn-select rounded-lg font-bold" id="btn-c2">2 CARTELAS</button>
                    </div>
                </div>
                <!-- Adversários -->
                <div>
                    <label class="text-blue-300 text-[10px] font-bold uppercase block mb-1">Adversários</label>
                    <div class="grid grid-cols-4 gap-2">
                         <button onclick="setBots(1)" class="py-2 btn-select rounded-lg font-bold" id="btn-b1">1</button>
                         <button onclick="setBots(3)" class="py-2 btn-select rounded-lg font-bold" id="btn-b3">3</button>
                         <button onclick="setBots(7)" class="py-2 btn-select rounded-lg font-bold" id="btn-b7">7</button>
                         <button onclick="setBots(10)" class="py-2 btn-select rounded-lg font-bold" id="btn-b10">10</button>
                    </div>
                </div>
                <!-- Regra -->
                <div>
                     <label class="text-blue-300 text-[10px] font-bold uppercase block mb-1">Meta</label>
                     <select id="sel-rule" class="w-full p-3 bg-black/50 text-white rounded-lg border border-white/20 text-sm outline-none font-bold" onchange="updatePot()">
                         <option value="line">LINHA (Rápido)</option>
                         <option value="full">CARTELA CHEIA</option>
                     </select>
                </div>
                <!-- Aposta -->
                <div class="bg-blue-900/30 p-3 rounded-xl border border-white/10">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-blue-200 text-xs">Saldo:</span>
                        <span class="text-xl font-bold text-yellow-400">$ <span id="ui-bal">500</span></span>
                    </div>
                    <div class="flex gap-2 mb-2">
                        <button onclick="setBet(10)" class="flex-1 py-2 bg-white/10 rounded text-xs font-bold hover:bg-white/20">10</button>
                        <button onclick="setBet(50)" class="flex-1 py-2 bg-white/10 rounded text-xs font-bold hover:bg-white/20">50</button>
                        <button onclick="setBet(100)" class="flex-1 py-2 bg-white/10 rounded text-xs font-bold hover:bg-white/20">100</button>
                    </div>
                    <div class="text-center bg-green-900/40 p-1 rounded border border-green-500/30">
                        <span class="text-green-300 text-[10px] uppercase">Prêmio Possível:</span>
                        <span class="font-bold text-2xl text-green-400 block">$ <span id="ui-pot">0</span></span>
                    </div>
                </div>
            </div>
            <button onclick="startGame()" class="w-full mt-4 btn-action py-4 rounded-lg text-xl shadow-xl tracking-wide">INICIAR JOGO</button>
        </div>
    </section>

    <!-- TELA 3: JOGO -->
    <section id="screen-game" class="hidden h-full flex-col">
        
        <!-- HEADER OTIMIZADO -->
        <div class="flex-none bg-black/30 backdrop-blur-md border-b border-white/10 pt-2 pb-1 px-3 z-20 shadow-md">
            
            <!-- LINHA 1: INFO PRINCIPAL -->
            <div class="flex items-center justify-between mb-1">
                <!-- Jogador & Saldo -->
                <div class="flex flex-col">
                    <div class="text-yellow-400 font-bold text-sm truncate max-w-[120px]" id="game-pname">😎 Jogador</div>
                    <div class="text-[10px] text-blue-200 font-bold">Saldo: <span class="text-white text-base">$ <span id="game-bal">500</span></span></div>
                </div>

                <!-- HEADLINE CENTRAL -->
                <div class="flex-1 text-center px-1">
                    <div class="bg-blue-600/30 border border-blue-400/30 rounded px-3 py-1 inline-block">
                        <div class="text-[10px] md:text-xs text-yellow-100 font-bold uppercase tracking-wide leading-tight" id="game-rule-text">
                            GANHA: LINHA
                        </div>
                    </div>
                </div>

                <!-- Prêmio -->
                <div class="flex flex-col items-end">
                    <div class="text-[9px] text-green-300 uppercase">Prêmio</div>
                    <div class="text-xl font-bold text-green-400 leading-none drop-shadow">$ <span id="game-pot">0</span></div>
                </div>
            </div>

            <!-- LINHA 2: HISTÓRICO & RIVAIS -->
            <div class="flex flex-col gap-1">
                <!-- Histórico -->
                <div class="flex items-center gap-2 h-12 bg-black/40 rounded-lg px-2 relative overflow-hidden border border-white/5">
                    <div class="absolute left-0 top-0 bottom-0 w-4 bg-gradient-to-r from-black/80 to-transparent z-10"></div>
                    <div id="ball-history" class="flex items-center gap-2 overflow-x-auto no-scrollbar w-full flex-row-reverse px-1">
                        <span class="text-[10px] text-gray-400 italic">Sorteando...</span>
                    </div>
                </div>
                
                <!-- Rivais -->
                <div id="rivals-bar" class="flex gap-2 overflow-x-auto no-scrollbar py-1 min-h-[22px]"></div>
            </div>
        </div>
        
        <!-- MENSAGEM / ALERTA -->
        <div class="flex-none bg-black/50 text-center py-0.5 border-b border-white/5">
            <span id="game-msg" class="text-blue-100 text-[10px] uppercase tracking-widest font-bold">Boa Sorte!</span>
        </div>

        <!-- ÁREA CENTRAL (CARTELA) -->
        <div id="game-area" class="flex-1 min-h-0 relative w-full flex flex-col items-center justify-center bg-transparent p-1 overflow-y-auto">
            <!-- Cartela injetada aqui -->
        </div>

        <!-- RODAPÉ CONTROLES -->
        <div class="flex-none bg-black/40 backdrop-blur-md border-t border-white/10 p-2 z-20 safe-area-bottom">
            <div class="flex items-center justify-between gap-3 max-w-md mx-auto">
                <button onclick="quit()" class="px-4 py-3 rounded-lg bg-white/10 text-gray-300 border border-white/10 text-xs font-bold hover:bg-white/20">
                    MENU
                </button>
                
                <button onclick="togglePlay()" id="btn-play" class="flex-grow h-12 rounded-lg btn-action text-base flex items-center justify-center gap-2 shadow-lg uppercase tracking-wide">
                    <i class="fas fa-play"></i> <span>Começar</span>
                </button>

                 <button onclick="toggleMute()" class="w-12 h-12 rounded-lg bg-white/10 text-gray-300 border border-white/10 flex items-center justify-center hover:bg-white/20">
                    <i id="icon-sound" class="fas fa-volume-up text-sm"></i>
                </button>
            </div>
        </div>

    </section>

    <!-- MODAL VITORIA/DERROTA -->
    <div id="modal-end" class="fixed inset-0 z-50 hidden modal-bg flex items-center justify-center p-6">
        <div class="bg-blue-900 border-4 border-yellow-500 rounded-2xl p-6 text-center max-w-xs w-full shadow-2xl relative overflow-hidden">
            <div class="absolute inset-0 bg-white/5 animate-pulse pointer-events-none"></div>
            <h2 id="end-title" class="text-4xl text-yellow-400 vegas-font mb-2 drop-shadow-md">BINGO!</h2>
            <p id="end-msg" class="text-white text-base mb-4 font-bold">Vitória!</p>
            <div class="bg-black/40 p-3 rounded-xl mb-4 border border-white/10" id="prize-box">
                <span class="text-blue-300 text-[10px] uppercase">Você Ganhou</span>
                <div class="text-3xl font-bold text-green-400 mt-1">$ <span id="win-amount">0</span></div>
            </div>
            <button onclick="closeEnd()" class="w-full btn-action py-3 rounded-lg text-base uppercase font-bold shadow-lg">Continuar</button>
        </div>
    </div>

    <!-- JS OTIMIZADO -->
    <script>
        var $ = function(id) { return document.getElementById(id); };
        
        // --- AUDIO ENGINE OTIMIZADA ---
        var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        var shakerBuffer = null;

        function initAudio() {
            if(!shakerBuffer) {
                var rate = audioCtx.sampleRate;
                var len = rate * 1.0; // Reduzido para 1s para ser mais leve
                shakerBuffer = audioCtx.createBuffer(1, len, rate);
                var data = shakerBuffer.getChannelData(0);
                for(var i=0; i < len; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
            }
        }

        function resumeAudio() { if (audioCtx.state === 'suspended') audioCtx.resume(); }

        function playSound(type) {
            if(S.mute) return;
            resumeAudio();
            var now = audioCtx.currentTime;
            
            // Garbage Collection Manual: Desconectar após uso
            var gain = audioCtx.createGain();
            gain.connect(audioCtx.destination);

            if(type === 'shaker') {
                if(!shakerBuffer) initAudio();
                var src = audioCtx.createBufferSource();
                src.buffer = shakerBuffer;
                var filter = audioCtx.createBiquadFilter();
                filter.type = 'highpass'; filter.frequency.value = 800;
                
                src.connect(filter); filter.connect(gain);
                
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.2, now + 0.1);
                gain.gain.linearRampToValueAtTime(0, now + 0.5);
                
                src.start(now); src.stop(now + 0.6);
                
                // Limpeza
                setTimeout(function(){ src.disconnect(); gain.disconnect(); }, 1000);
            }
            else if(type === 'draw') {
                var osc = audioCtx.createOscillator();
                osc.connect(gain);
                osc.type = 'triangle'; 
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.exponentialRampToValueAtTime(1000, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
                setTimeout(function(){ osc.disconnect(); gain.disconnect(); }, 1000);
            }
            else if(type === 'click') {
                var osc = audioCtx.createOscillator();
                osc.connect(gain);
                osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.1, now);
                osc.start(now); osc.stop(now + 0.1);
                setTimeout(function(){ osc.disconnect(); gain.disconnect(); }, 500);
            }
            else if(type === 'alert') {
                var osc = audioCtx.createOscillator();
                osc.connect(gain);
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, now);
                gain.gain.setValueAtTime(0.1, now);
                osc.start(now); osc.stop(now + 0.3);
                setTimeout(function(){ osc.disconnect(); gain.disconnect(); }, 1000);
            }
            else if(type === 'win') {
                [523, 659, 783, 1046].forEach(function(f, i) {
                    var o = audioCtx.createOscillator(); 
                    var g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.frequency.value = f;
                    g.gain.setValueAtTime(0.1, now + i*0.1);
                    g.gain.linearRampToValueAtTime(0, now + i*0.1 + 0.5);
                    o.start(now + i*0.1); o.stop(now + i*0.1 + 0.5);
                    setTimeout(function(){ o.disconnect(); g.disconnect(); }, 2000);
                });
            }
        }

        function speak(text) {
            if(S.mute || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel(); // Sempre cancela anterior para não encavalar
            var u = new SpeechSynthesisUtterance(text);
            u.lang = 'pt-BR'; u.rate = 1.1; 
            window.speechSynthesis.speak(u);
        }

        // --- DADOS ---
        var botNames = ["🤖 Maria", "🤠 José", "👩 Ana", "👴 Carlos", "🧑‍🦱 Pedro", "👵 Lúcia", "👨‍✈️ Paulo", "👩‍🏫 Fernanda", "👮 Roberto", "👸 Iza"];
        var phrases = [
            "🧠 Exercita a memória!", "👀 Foco total!", "⚡ Raciocínio rápido!",
            "✨ Mente ativa!", "😁 Diversão garantida!", "🧘 Respire fundo!",
            "🎯 Olho na cartela!"
        ];
        
        var S = {
            scr: 'welcome', name: '', bal: 500, mute: false,
            cfg: { cards: 1, rule: 'line', bet: 10, spd: 4500, botCount: 3 },
            game: { active: false, pause: true, drawn: [], timer: null, cards: [], marks: [], bots: [] }
        };

        // --- CORE ---
        window.onload = function() {
            initAudio(); 
            var sn = localStorage.getItem('bingo_nm');
            var sb = localStorage.getItem('bingo_bl');
            if(sb) S.bal = parseInt(sb);
            if(sn) { S.name = sn; $('inp-name').value = sn; }
            updUi();
        };

        function updUi() {
            $('ui-bal').innerText = S.bal;
            localStorage.setItem('bingo_bl', S.bal);
        }

        function switchScr(id) {
            document.querySelectorAll('section').forEach(function(el) {
                el.classList.add('hidden'); el.classList.remove('flex');
            });
            $(id).classList.remove('hidden'); $(id).classList.add('flex');
        }

        // --- CONFIG ---
        function goConfig() {
            resumeAudio();
            var n = $('inp-name').value.trim();
            if(!n) return alert('Digite seu nome.');
            S.name = n; localStorage.setItem('bingo_nm', n);
            switchScr('screen-config');
            playSound('click');
            setCards(1); setBet(10); setBots(3);
        }

        function setCards(n) {
            S.cfg.cards = n;
            $('btn-c1').classList.toggle('active', n===1);
            $('btn-c2').classList.toggle('active', n===2);
            playSound('click');
        }
        function setBots(n) {
            S.cfg.botCount = n;
            [1,3,7,10].forEach(function(k) {
                var el = $('btn-b'+k);
                if(el) el.classList.toggle('active', k===n);
            });
            playSound('click');
        }
        function setBet(n) {
            if(n > S.bal) return alert('Saldo insuficiente!');
            S.cfg.bet = n; updatePot(); playSound('click');
        }
        function updatePot() {
            var m = $('sel-rule').value === 'full' ? 5 : 2;
            $('ui-pot').innerText = S.cfg.bet * m;
        }
        function toggleMute() {
            S.mute = !S.mute;
            $('icon-sound').className = S.mute ? 'fas fa-volume-mute text-red-500 text-xs' : 'fas fa-volume-up text-xs';
            if(S.mute) window.speechSynthesis.cancel();
        }

        // --- GAME ---
        function startGame() {
            resumeAudio();
            if(S.bal < S.cfg.bet) return alert('Sem saldo.');
            S.bal -= S.cfg.bet; updUi();
            
            S.game = { active: true, pause: true, drawn: [], timer: null, cards: [], marks: [], bots: [] };
            
            $('ball-history').innerHTML = ''; 
            $('game-pname').innerText = "😎 " + S.name;
            $('game-bal').innerText = S.bal;
            var m = $('sel-rule').value === 'full' ? 5 : 2;
            $('game-pot').innerText = (S.cfg.bet * m);
            
            var ruleLabel = $('sel-rule').value === 'full' ? "COMPLETAR CARTELA" : "FAZER UMA LINHA";
            $('game-rule-text').innerText = "GANHA: " + ruleLabel;

            var btn = $('btn-play');
            btn.innerHTML = '<i class="fas fa-play"></i> <span>COMEÇAR</span>';
            btn.className = "flex-grow h-10 rounded-lg btn-action text-sm flex items-center justify-center gap-2 shadow-lg uppercase tracking-wide";
            
            $('game-msg').innerText = "Divirta-se!";
            $('game-msg').className = "text-blue-100 text-[10px] uppercase tracking-widest font-bold";

            var needed = $('sel-rule').value === 'full' ? 24 : 5;
            var shuffled = botNames.sort(function() { return 0.5 - Math.random() });
            for(var i=0; i<S.cfg.botCount; i++) {
                var bName = shuffled[i] || ("Bot " + (i+1));
                S.game.bots.push({ name: bName, needed: needed });
            }
            updateRivalsUI();

            genCards();
            renderCards();
            switchScr('screen-game');
            playSound('click');
        }

        function updateRivalsUI() {
            var html = "";
            var alertMsg = "";
            
            // Bot Logic
            S.game.bots.forEach(function(b) {
                var styleClass = "";
                if (b.needed === 3) styleClass = "warn-3";
                if (b.needed === 2) styleClass = "warn-2";
                if (b.needed === 1) styleClass = "warn-1";

                html += '<div class="rival-pill text-white '+styleClass+'"><span class="font-bold">'+b.name+'</span><span class="text-blue-200 text-[9px] ml-1">falta '+b.needed+'</span></div>';
                
                if(b.needed === 1) alertMsg = "⚠️ " + b.name + " POR UMA!";
            });
            $('rivals-bar').innerHTML = html;
            
            if(alertMsg) {
                $('game-msg').innerText = alertMsg;
                $('game-msg').className = "text-yellow-300 text-xs uppercase tracking-widest font-bold alert-text";
            }
        }

        function genCards() {
            var ranges = [[1,15],[16,30],[31,45],[46,60],[61,75]];
            for(var c=0; c<S.cfg.cards; c++){
                var flat = new Array(25).fill(0);
                for(var col=0; col<5; col++){
                    var nums = [];
                    while(nums.length<5){
                        var r = Math.floor(Math.random()*(ranges[col][1]-ranges[col][0]+1))+ranges[col][0];
                        if(nums.indexOf(r) === -1) nums.push(r);
                    }
                    for(var row=0; row<5; row++) flat[row*5+col] = nums[row];
                }
                flat[12] = 0; 
                S.game.cards.push(flat);
                var m = new Array(25).fill(false); m[12] = true;
                S.game.marks.push(m);
            }
        }

        function renderCards() {
            var area = $('game-area'); area.innerHTML = '';
            var wrap = document.createElement('div');
            wrap.className = S.cfg.cards === 1 ? "cards-wrapper" : "cards-container-2";

            S.game.cards.forEach(function(card, cIdx) {
                var div = document.createElement('div');
                div.className = "bingo-card";
                
                ['B','I','N','G','O'].forEach(function(l) {
                    var h = document.createElement('div');
                    h.className = "header-cell"; h.innerText = l;
                    div.appendChild(h);
                });

                card.forEach(function(n, i) {
                    var cell = document.createElement('div');
                    cell.className = "num-cell"; cell.id = 'c'+cIdx+'-'+i;
                    
                    if(n === 0) {
                        cell.classList.add('marked', 'free');
                        cell.innerHTML = '<i class="fas fa-star text-yellow-600"></i>';
                    } else {
                        cell.innerText = n;
                        cell.onclick = function() { hit(cIdx, i, n); };
                    }
                    div.appendChild(cell);
                });
                wrap.appendChild(div);
            });
            area.appendChild(wrap);
        }

        // --- SISTEMA DE SORTEIO OTIMIZADO (RECURSIVO) ---
        // Evita travamentos por stack overflow de setInterval
        function togglePlay() {
            if(S.game.pause) {
                S.game.pause = false;
                var btn = $('btn-play');
                btn.innerHTML = '<i class="fas fa-pause"></i> <span>PAUSAR</span>';
                btn.className = "flex-grow h-10 rounded-lg btn-yellow text-sm flex items-center justify-center gap-2 shadow-lg uppercase tracking-wide";
                
                if(S.game.drawn.length === 0) loopDraw(); // Inicia
                else loopDraw(); // Retoma
            } else { 
                stop(); 
                var btn = $('btn-play');
                btn.innerHTML = '<i class="fas fa-play"></i> <span>CONTINUAR</span>';
                btn.className = "flex-grow h-10 rounded-lg btn-action text-sm flex items-center justify-center gap-2 shadow-lg uppercase tracking-wide";
            }
        }

        function stop() {
            S.game.pause = true; 
            clearTimeout(S.game.timer); // Para o timeout recursivo
        }

        function loopDraw() {
            if(S.game.pause || !S.game.active) return;
            draw();
            // Agenda o próximo sorteio APENAS após o atual ser processado
            // spd + 1000ms de margem de animação/som
            S.game.timer = setTimeout(loopDraw, S.cfg.spd); 
        }

        function draw() {
            if(S.game.drawn.length >= 75) { stop(); alert("Fim das pedras!"); return; }

            // Frases aleatórias
            if(Math.random() < 0.2 && !$('game-msg').innerText.includes("⚠️")) {
                $('game-msg').innerText = phrases[Math.floor(Math.random()*phrases.length)];
                $('game-msg').className = "text-blue-100 text-[10px] uppercase tracking-widest font-bold";
            }

            // Toca som Shaker antes
            playSound('shaker');

            setTimeout(function() {
                if(!S.game.active || S.game.pause) return; // Checa se pausou durante o som
                
                var n; do { n = Math.floor(Math.random()*75)+1; } while(S.game.drawn.indexOf(n) !== -1);
                S.game.drawn.push(n);

                // Update Ball
                var hist = $('ball-history');
                if(S.game.drawn.length === 1) hist.innerHTML = '';
                var prev = hist.querySelector('.latest');
                if(prev) prev.classList.remove('latest');

                var ballEl = document.createElement('div');
                ballEl.className = "ball-hist latest";
                ballEl.innerText = n;
                // Animação CSS simples
                ballEl.style.animation = "pulse-gold 1s infinite"; 

                // Limitar histórico no DOM para não travar (apenas últimos 10 visíveis)
                if(hist.children.length > 15) hist.removeChild(hist.lastChild);
                hist.prepend(ballEl);
                
                playSound('draw');
                speak(n.toString());

                // Bot Logic
                S.game.bots.forEach(function(b) {
                    if(b.needed > 0 && Math.random() < 0.22) { 
                        b.needed--;
                    }
                });
                updateRivalsUI();
                
                // Bot Win Check
                var winnerBot = S.game.bots.find(function(b) { return b.needed === 0; });
                if(winnerBot) {
                    doEnd(false, winnerBot.name);
                }

            }, 500); // Sincroniza com shaker
        }

        function hit(cIdx, i, n) {
            if(S.game.marks[cIdx][i]) return;
            var el = $('c'+cIdx+'-'+i);
            
            if(S.game.drawn.indexOf(n) !== -1) {
                S.game.marks[cIdx][i] = true;
                el.classList.add('marked');
                playSound('click');
                checkWin(cIdx);
                checkNearWin(cIdx);
            } else {
                el.classList.add('shake');
                setTimeout(function() { el.classList.remove('shake'); }, 400);
            }
        }

        function checkNearWin(cIdx) {
            var m = S.game.marks[cIdx];
            var r = $('sel-rule').value;
            var neededMin = 99;

            if(r === 'line') {
                var lines = [];
                for(var k=0; k<5; k++) {
                    lines.push([k*5, k*5+1, k*5+2, k*5+3, k*5+4]); // rows
                    lines.push([k, k+5, k+10, k+15, k+20]); // cols
                }
                lines.forEach(function(line) {
                    var missing = line.filter(function(idx) { return !m[idx]; }).length;
                    if(missing < neededMin) neededMin = missing;
                });
            } else {
                neededMin = m.filter(function(x) { return !x; }).length;
            }

            if(neededMin === 1 || neededMin === 2) {
                showAnxietyPopup(neededMin);
            }
        }

        function showAnxietyPopup(n) {
            var pop = $('anxiety-alert');
            var txt = $('anxiety-main');
            
            txt.innerText = "FALTA " + (n===1 ? "UMA!" : "DUAS!");
            pop.classList.add('show');
            playSound('alert');
            
            setTimeout(function() {
                pop.classList.remove('show');
            }, 2000);
        }

        function checkWin(cIdx) {
            var m = S.game.marks[cIdx];
            var r = $('sel-rule').value;
            var w = false;
            var _chk = function(arr) { return arr.every(function(x) { return m[x]; }); };

            if(r === 'line') {
                for(var k=0; k<5; k++) {
                    if(_chk([k*5, k*5+1, k*5+2, k*5+3, k*5+4])) w=true; 
                    if(_chk([k, k+5, k+10, k+15, k+20])) w=true;
                }
            } else {
                if(m.every(function(x) { return x; })) w=true;
            }

            if(w) doEnd(true, S.name);
        }

        function doEnd(won, winnerName) {
            stop(); S.game.active = false;
            var border = $('modal-border');
            var title = $('end-title');
            var msg = $('end-msg');
            var pbox = $('prize-box');
            
            if(won) {
                var mult = $('sel-rule').value === 'full' ? 5 : 2;
                var prize = S.cfg.bet * mult;
                S.bal += prize; updUi();
                
                title.innerText = "BINGO!";
                title.className = "text-5xl text-yellow-400 vegas-font mb-2";
                msg.innerText = "Parabéns, " + S.name + "!";
                pbox.style.display = "block";
                $('win-amount').innerText = prize;
                playSound('win');
            } else {
                title.innerText = "DERROTA";
                title.className = "text-4xl text-red-500 vegas-font mb-2";
                msg.innerText = winnerName + " bateu o Bingo!";
                pbox.style.display = "none";
            }
            
            $('modal-end').classList.remove('hidden');
        }

        function closeEnd() {
            $('modal-end').classList.add('hidden');
            switchScr('screen-config');
        }

        function quit() {
            if(confirm('Deseja realmente sair?')) {
                stop(); window.speechSynthesis.cancel();
                switchScr('screen-config');
            }
        }
    </script>
</body>
