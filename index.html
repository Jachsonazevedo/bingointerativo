<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Schola da Mente - Bingo da Mente</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        /* --- Configurações Globais --- */
        :root {
            --gold: #FFD700;
            --gold-dark: #B8860B;
            --royal-blue: #1e3a8a; 
            --royal-dark: #0f172a;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--royal-dark);
            color: white;
            /* Garante altura correta em mobile ignorando barra de endereço */
            height: 100dvh; 
            width: 100vw;
            overflow: hidden; 
            touch-action: manipulation;
            background-image: radial-gradient(circle at 50% 30%, #172554 0%, #020617 100%);
        }

        .vegas-font { font-family: 'Righteous', cursive; letter-spacing: 1px; }

        /* --- LAYOUT DA CARTELA --- */
        /* Área da cartela deve ocupar o espaço restante sem scroll */
        .game-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 1vmin;
        }

        .bingo-card {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: auto repeat(5, 1fr);
            gap: 0.8vmin;
            
            /* Lógica de redimensionamento inteligente */
            width: auto;
            height: auto;
            /* Limita para não tocar nas bordas ou cabeçalhos */
            max-width: 95%;
            max-height: 95%;
            
            /* Mantém a proporção de Bingo (aprox 5 largura por 6 altura com header) */
            aspect-ratio: 5 / 6;
            
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            padding: 1vmin;
            border-radius: 1rem;
            border: 2px solid var(--gold);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        /* Se tiver 2 cartelas */
        .cards-container-2 {
            display: flex;
            gap: 2vmin;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
        }
        @media (orientation: portrait) {
            .cards-container-2 { flex-direction: column; }
            .cards-container-2 .bingo-card { max-height: 45%; }
        }

        /* CABEÇALHO B I N G O */
        .header-cell {
            background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%);
            color: white;
            font-family: 'Righteous', cursive;
            font-size: clamp(1rem, 4vmin, 2.5rem);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.3rem;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.3);
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* CÉLULAS NÚMEROS */
        .num-cell {
            background: #f8fafc;
            color: #0f172a;
            font-weight: 900;
            font-size: clamp(1.2rem, 5vmin, 3.5rem);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.3rem;
            cursor: pointer;
            user-select: none;
            box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        .num-cell:active { transform: scale(0.90); }

        .num-cell.marked {
            background: radial-gradient(circle at 30% 30%, #facc15 0%, #ca8a04 85%);
            color: #422006;
            border: 2px solid #fef08a;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .num-cell.free { background: #cbd5e1; color: #64748b; }
        .num-cell.free.marked { background: radial-gradient(circle, #facc15, #ca8a04); }

        .num-cell.shake { animation: shake 0.4s; background-color: #fca5a5; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }

        /* UI ELEMENTS */
        .ball-hist {
            width: 2rem; height: 2rem;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            color: #e2e8f0;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem; font-weight: bold;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .ball-hist.latest {
            width: 2.4rem; height: 2.4rem;
            background: #facc15; color: black;
            border-color: white;
            font-size: 1.1rem;
            box-shadow: 0 0 10px #facc15;
            animation: pulse-gold 1s infinite;
        }
        @keyframes pulse-gold { 50% { box-shadow: 0 0 20px #facc15; } }

        /* BOTÕES */
        .btn-action {
            background: linear-gradient(to bottom, #16a34a, #15803d);
            border-bottom: 3px solid #14532d;
            color: white; font-weight: bold;
            transition: all 0.1s;
        }
        .btn-action:active { transform: translateY(3px); border-bottom: 0; }
        
        .btn-yellow {
            background: linear-gradient(to bottom, #ca8a04, #a16207);
            border-bottom: 3px solid #713f12;
            color: white;
        }

        /* PILLS */
        .rival-pill {
            background: rgba(0,0,0,0.5);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 4px;
            border: 1px solid rgba(255,255,255,0.1);
            white-space: nowrap;
        }
        .rival-pill.warn { border-color: #ef4444; color: #fca5a5; animation: pulse-red 1s infinite; }
        @keyframes pulse-red { 50% { opacity: 0.7; } }

        .modal-bg { background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* ALERTA */
        .alert-text { animation: flash 0.6s infinite alternate; color: #fef08a; }
        @keyframes flash { from { opacity: 1; } to { opacity: 0.6; } }

        /* CONFIG BTN */
        .btn-select { background: rgba(255,255,255,0.1); border: 2px solid transparent; color: #cbd5e1; }
        .btn-select.active { background: rgba(0,0,0,0.3); border-color: #facc15; color: white; }
    </style>
</head>
<body class="h-[100dvh] w-full flex flex-col overflow-hidden">

    <!-- TELA 1: WELCOME -->
    <section id="screen-welcome" class="flex-grow flex flex-col items-center justify-center p-4 relative z-10 text-center h-full">
        <div class="mb-4 p-4 rounded-full border-4 border-yellow-500 bg-black/40 shadow-lg animate-bounce">
            <i class="fas fa-gem text-5xl text-yellow-400"></i>
        </div>
        <h1 class="text-5xl text-yellow-400 mb-1 vegas-font drop-shadow-md">BINGO</h1>
        <h2 class="text-lg text-blue-200 tracking-widest mb-6 uppercase font-light">Schola da Mente</h2>
        
        <div class="w-full max-w-xs">
            <input type="text" id="inp-name" class="w-full p-3 mb-4 rounded-xl bg-white/10 text-white text-center text-xl border border-white/20 focus:border-yellow-400 outline-none placeholder-blue-300" placeholder="Digite seu nome">
            <button onclick="goConfig()" class="w-full btn-action py-3 rounded-xl text-lg shadow-lg uppercase tracking-wide">ENTRAR</button>
        </div>
    </section>

    <!-- TELA 2: CONFIG -->
    <section id="screen-config" class="hidden flex-col h-full items-center justify-center p-4 overflow-y-auto">
        <div class="w-full max-w-md bg-black/40 border border-white/10 rounded-2xl shadow-2xl p-5 backdrop-blur-md">
            <h2 class="text-2xl text-yellow-400 text-center vegas-font mb-4">CONFIGURAR MESA</h2>
            <div class="space-y-4">
                <!-- Cartelas -->
                <div>
                    <label class="text-blue-300 text-[10px] font-bold uppercase block mb-1">Cartelas</label>
                    <div class="flex gap-2">
                        <button onclick="setCards(1)" class="flex-1 py-2 btn-select rounded-lg" id="btn-c1">1 CARTELA</button>
                        <button onclick="setCards(2)" class="flex-1 py-2 btn-select rounded-lg" id="btn-c2">2 CARTELAS</button>
                    </div>
                </div>
                <!-- Adversários -->
                <div>
                    <label class="text-blue-300 text-[10px] font-bold uppercase block mb-1">Rivais</label>
                    <div class="grid grid-cols-4 gap-2">
                         <button onclick="setBots(1)" class="py-2 btn-select rounded-lg" id="btn-b1">1</button>
                         <button onclick="setBots(3)" class="py-2 btn-select rounded-lg" id="btn-b3">3</button>
                         <button onclick="setBots(7)" class="py-2 btn-select rounded-lg" id="btn-b7">7</button>
                         <button onclick="setBots(10)" class="py-2 btn-select rounded-lg" id="btn-b10">10</button>
                    </div>
                </div>
                <!-- Regra -->
                <div>
                     <label class="text-blue-300 text-[10px] font-bold uppercase block mb-1">Meta</label>
                     <select id="sel-rule" class="w-full p-2 bg-black/50 text-white rounded-lg border border-white/20 text-sm outline-none" onchange="updatePot()">
                         <option value="line">LINHA (Rápido)</option>
                         <option value="full">CARTELA CHEIA</option>
                     </select>
                </div>
                <!-- Aposta -->
                <div class="bg-blue-900/30 p-3 rounded-xl border border-white/10">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-blue-200 text-xs">Saldo:</span>
                        <span class="text-xl font-bold text-yellow-400">$ <span id="ui-bal">500</span></span>
                    </div>
                    <div class="flex gap-2 mb-2">
                        <button onclick="setBet(10)" class="flex-1 py-1 bg-white/10 rounded text-xs font-bold hover:bg-white/20">10</button>
                        <button onclick="setBet(50)" class="flex-1 py-1 bg-white/10 rounded text-xs font-bold hover:bg-white/20">50</button>
                        <button onclick="setBet(100)" class="flex-1 py-1 bg-white/10 rounded text-xs font-bold hover:bg-white/20">100</button>
                    </div>
                    <div class="text-center bg-green-900/40 p-1 rounded border border-green-500/30">
                        <span class="text-green-300 text-[10px] uppercase">Se vencer:</span>
                        <span class="font-bold text-xl text-green-400 block">$ <span id="ui-pot">0</span></span>
                    </div>
                </div>
            </div>
            <button onclick="startGame()" class="w-full mt-4 btn-action py-3 rounded-lg text-lg shadow-xl tracking-wide">INICIAR</button>
        </div>
    </section>

    <!-- TELA 3: JOGO -->
    <section id="screen-game" class="hidden h-full flex-col">
        
        <!-- HEADER OTIMIZADO PARA MOBILE -->
        <!-- flex-none impede que o header encolha ou suma -->
        <div class="flex-none bg-black/30 backdrop-blur-md border-b border-white/10 pt-2 pb-1 px-3 z-20 shadow-md">
            
            <!-- LINHA 1: INFO PRINCIPAL -->
            <div class="flex items-center justify-between mb-1">
                <!-- Jogador & Saldo -->
                <div class="flex flex-col">
                    <div class="text-yellow-400 font-bold text-sm truncate max-w-[120px]" id="game-pname">😎 Jogador</div>
                    <div class="text-[10px] text-blue-200 font-bold">Saldo: <span class="text-white text-base">$ <span id="game-bal">500</span></span></div>
                </div>

                <!-- HEADLINE CENTRAL -->
                <div class="flex-1 text-center px-1">
                    <div class="bg-blue-600/30 border border-blue-400/30 rounded px-2 py-1 inline-block">
                        <div class="text-[9px] md:text-xs text-yellow-100 font-bold uppercase tracking-wide leading-tight" id="game-rule-text">
                            GANHA: LINHA
                        </div>
                    </div>
                </div>

                <!-- Prêmio -->
                <div class="flex flex-col items-end">
                    <div class="text-[9px] text-green-300 uppercase">Prêmio</div>
                    <div class="text-xl font-bold text-green-400 leading-none drop-shadow">$ <span id="game-pot">0</span></div>
                </div>
            </div>

            <!-- LINHA 2: HISTÓRICO & RIVAIS -->
            <div class="flex flex-col gap-1">
                <!-- Histórico -->
                <div class="flex items-center gap-2 h-10 bg-black/40 rounded-lg px-2 relative overflow-hidden border border-white/5">
                    <div class="absolute left-0 top-0 bottom-0 w-4 bg-gradient-to-r from-black/80 to-transparent z-10"></div>
                    <div id="ball-history" class="flex items-center gap-1 overflow-x-auto no-scrollbar w-full flex-row-reverse px-1">
                        <span class="text-[10px] text-gray-400 italic">...</span>
                    </div>
                </div>
                
                <!-- Rivais -->
                <div id="rivals-bar" class="flex gap-2 overflow-x-auto no-scrollbar py-1 min-h-[22px]"></div>
            </div>
        </div>
        
        <!-- MENSAGEM / ALERTA -->
        <div class="flex-none bg-black/50 text-center py-0.5 border-b border-white/5">
            <span id="game-msg" class="text-blue-100 text-[10px] uppercase tracking-widest font-bold">Boa Sorte!</span>
        </div>

        <!-- ÁREA CENTRAL (CARTELA) -->
        <!-- flex-1 e min-h-0 garantem que o flexbox calcule o tamanho restante corretamente -->
        <div id="game-area" class="flex-1 min-h-0 relative w-full flex flex-col items-center justify-center bg-transparent p-1">
            <!-- Cartela injetada aqui -->
        </div>

        <!-- RODAPÉ CONTROLES -->
        <div class="flex-none bg-black/40 backdrop-blur-md border-t border-white/10 p-2 z-20 safe-area-bottom">
            <div class="flex items-center justify-between gap-2 max-w-md mx-auto">
                <button onclick="quit()" class="px-3 py-2 rounded-lg bg-white/10 text-gray-300 border border-white/10 text-[10px] font-bold hover:bg-white/20">
                    <i class="fas fa-arrow-left"></i> MENU
                </button>
                
                <button onclick="togglePlay()" id="btn-play" class="flex-grow h-10 rounded-lg btn-action text-sm flex items-center justify-center gap-2 shadow-lg uppercase tracking-wide">
                    <i class="fas fa-play"></i> <span>Começar</span>
                </button>

                 <button onclick="toggleMute()" class="w-10 h-10 rounded-lg bg-white/10 text-gray-300 border border-white/10 flex items-center justify-center hover:bg-white/20">
                    <i id="icon-sound" class="fas fa-volume-up text-xs"></i>
                </button>
            </div>
        </div>

    </section>

    <!-- MODAL VITORIA/DERROTA -->
    <div id="modal-end" class="fixed inset-0 z-50 hidden modal-bg flex items-center justify-center p-6">
        <div class="bg-blue-900 border-4 border-yellow-500 rounded-2xl p-6 text-center max-w-xs w-full shadow-2xl relative overflow-hidden">
            <div class="absolute inset-0 bg-white/5 animate-pulse pointer-events-none"></div>
            <h2 id="end-title" class="text-4xl text-yellow-400 vegas-font mb-2 drop-shadow-md">BINGO!</h2>
            <p id="end-msg" class="text-white text-base mb-4 font-bold">Vitória!</p>
            <div class="bg-black/40 p-3 rounded-xl mb-4 border border-white/10" id="prize-box">
                <span class="text-blue-300 text-[10px] uppercase">Você Ganhou</span>
                <div class="text-3xl font-bold text-green-400 mt-1">$ <span id="win-amount">0</span></div>
            </div>
            <button onclick="closeEnd()" class="w-full btn-action py-3 rounded-lg text-base uppercase font-bold shadow-lg">Continuar</button>
        </div>
    </div>

    <!-- JS -->
    <script>
        var $ = function(id) { return document.getElementById(id); };
        var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        var botNames = ["🤖 Maria", "🤠 José", "👩 Ana", "👴 Carlos", "🧑‍🦱 Pedro", "👵 Lúcia", "👨‍✈️ Paulo", "👩‍🏫 Fernanda", "👮 Roberto", "👸 Iza"];
        var phrases = [
            "🧠 Exercita a memória!", "👀 Foco total!", "⚡ Raciocínio rápido!",
            "✨ Mente ativa!", "😁 Diversão garantida!", "🧘 Respire fundo!",
            "🎯 Olho na cartela!"
        ];
        
        var S = {
            scr: 'welcome', name: '', bal: 500, mute: false,
            cfg: { cards: 1, rule: 'line', bet: 10, spd: 4500, botCount: 3 },
            game: { active: false, pause: true, drawn: [], timer: null, cards: [], marks: [], bots: [] }
        };

        // AUDIO
        function resumeAudio() { if (audioCtx.state === 'suspended') audioCtx.resume(); }
        function playSound(type) {
            if(S.mute) return;
            resumeAudio();
            var now = audioCtx.currentTime;
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);

            if(type === 'click') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.1, now); osc.start(); osc.stop(now+0.1);
            } else if(type === 'draw') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(500, now);
                osc.frequency.linearRampToValueAtTime(1000, now+0.1);
                gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now+0.5);
                osc.start(); osc.stop(now+0.5);
            } else if(type === 'win') {
                [523, 659, 783, 1046].forEach((f, i) => {
                    var o = audioCtx.createOscillator(); var g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.type = 'square'; o.frequency.value = f;
                    g.gain.setValueAtTime(0.05, now + i*0.1); g.gain.linearRampToValueAtTime(0, now + i*0.1 + 0.4);
                    o.start(now + i*0.1); o.stop(now + i*0.1 + 0.4);
                });
            } else if(type === 'lose') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(100, now+0.5);
                gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now+0.5);
                osc.start(); osc.stop(now+0.5);
            } else if(type === 'alert') {
                osc.type = 'square'; osc.frequency.setValueAtTime(300, now);
                gain.gain.setValueAtTime(0.1, now); osc.frequency.linearRampToValueAtTime(200, now+0.3);
                osc.start(); osc.stop(now+0.3);
            }
        }

        function speak(text) {
            if(S.mute || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(text);
            u.lang = 'pt-BR'; u.rate = 1.0;
            window.speechSynthesis.speak(u);
        }

        // CORE
        window.onload = function() {
            var sn = localStorage.getItem('bingo_nm');
            var sb = localStorage.getItem('bingo_bl');
            if(sb) S.bal = parseInt(sb);
            if(sn) { S.name = sn; $('inp-name').value = sn; }
            updUi();
        };

        function updUi() {
            $('ui-bal').innerText = S.bal;
            localStorage.setItem('bingo_bl', S.bal);
        }

        function switchScr(id) {
            document.querySelectorAll('section').forEach(el => {
                el.classList.add('hidden'); el.classList.remove('flex');
            });
            $(id).classList.remove('hidden'); $(id).classList.add('flex');
        }

        // CONFIG
        function goConfig() {
            resumeAudio();
            var n = $('inp-name').value.trim();
            if(!n) return alert('Por favor, digite seu nome.');
            S.name = n; localStorage.setItem('bingo_nm', n);
            switchScr('screen-config');
            playSound('click');
            setCards(1); setBet(10); setBots(3);
        }

        function setCards(n) {
            S.cfg.cards = n;
            $('btn-c1').classList.toggle('active', n===1);
            $('btn-c2').classList.toggle('active', n===2);
            playSound('click');
        }
        function setBots(n) {
            S.cfg.botCount = n;
            [1,3,7,10].forEach(k => {
                var el = $('btn-b'+k);
                if(el) el.classList.toggle('active', k===n);
            });
            playSound('click');
        }
        function setBet(n) {
            if(n > S.bal) { playSound('lose'); return alert('Saldo insuficiente!'); }
            S.cfg.bet = n; updatePot(); playSound('click');
        }
        function updatePot() {
            var m = $('sel-rule').value === 'full' ? 5 : 2;
            $('ui-pot').innerText = S.cfg.bet * m;
        }
        function toggleMute() {
            S.mute = !S.mute;
            $('icon-sound').className = S.mute ? 'fas fa-volume-mute text-red-500 text-xs' : 'fas fa-volume-up text-xs';
            if(S.mute) window.speechSynthesis.cancel();
        }

        // GAME
        function startGame() {
            resumeAudio();
            if(S.bal < S.cfg.bet) return alert('Sem saldo.');
            S.bal -= S.cfg.bet; updUi();
            
            S.game = { active: true, pause: true, drawn: [], timer: null, cards: [], marks: [], bots: [] };
            
            $('ball-history').innerHTML = ''; 
            $('game-pname').innerText = "😎 " + S.name;
            $('game-bal').innerText = S.bal;
            var m = $('sel-rule').value === 'full' ? 5 : 2;
            $('game-pot').innerText = (S.cfg.bet * m);
            
            var ruleLabel = $('sel-rule').value === 'full' ? "COMPLETAR CARTELA" : "FAZER UMA LINHA";
            $('game-rule-text').innerText = "GANHA: " + ruleLabel;

            var btn = $('btn-play');
            btn.innerHTML = '<i class="fas fa-play"></i> <span>COMEÇAR</span>';
            btn.className = "flex-grow h-10 rounded-lg btn-action text-sm flex items-center justify-center gap-2 shadow-lg uppercase tracking-wide";
            
            $('game-msg').innerText = "Divirta-se!";
            $('game-msg').className = "text-blue-100 text-[10px] uppercase tracking-widest font-bold";

            var needed = $('sel-rule').value === 'full' ? 24 : 5;
            var shuffled = botNames.sort(() => 0.5 - Math.random());
            for(var i=0; i<S.cfg.botCount; i++) {
                var bName = shuffled[i] || ("Bot " + (i+1));
                S.game.bots.push({ name: bName, needed: needed });
            }
            updateRivalsUI();

            genCards();
            renderCards();
            switchScr('screen-game');
            playSound('click');
        }

        function updateRivalsUI() {
            var html = "";
            var alertMsg = "";
            
            S.game.bots.forEach(b => {
                var styleClass = "";
                if (b.needed === 3) styleClass = "warn-3";
                if (b.needed === 2) styleClass = "warn-2";
                if (b.needed === 1) styleClass = "warn-1";

                html += `<div class="rival-pill ${styleClass}"><span class="text-white font-bold">${b.name}</span><span class="text-blue-200 text-[9px]">falta ${b.needed}</span></div>`;
                
                if(b.needed === 1) alertMsg = "⚠️ " + b.name + " POR UMA!";
                else if(!alertMsg && b.needed === 2) alertMsg = "Atenção: " + b.name + " falta 2";
            });
            $('rivals-bar').innerHTML = html;
            
            if(alertMsg) {
                $('game-msg').innerText = alertMsg;
                $('game-msg').className = "text-yellow-300 text-xs uppercase tracking-widest font-bold alert-text";
                if(alertMsg.includes("POR UMA")) playSound('alert');
            }
        }

        function genCards() {
            var ranges = [[1,15],[16,30],[31,45],[46,60],[61,75]];
            for(var c=0; c<S.cfg.cards; c++){
                var flat = new Array(25).fill(0);
                for(var col=0; col<5; col++){
                    var nums = [];
                    while(nums.length<5){
                        var r = Math.floor(Math.random()*(ranges[col][1]-ranges[col][0]+1))+ranges[col][0];
                        if(!nums.includes(r)) nums.push(r);
                    }
                    for(var row=0; row<5; row++) flat[row*5+col] = nums[row];
                }
                flat[12] = 0; 
                S.game.cards.push(flat);
                var m = new Array(25).fill(false); m[12] = true;
                S.game.marks.push(m);
            }
        }

        function renderCards() {
            var area = $('game-area'); area.innerHTML = '';
            var wrap = document.createElement('div');
            // Container responsivo para 1 ou 2 cartelas
            wrap.className = S.cfg.cards === 1 ? "game-wrapper" : "cards-container-2";

            S.game.cards.forEach((card, cIdx) => {
                var div = document.createElement('div');
                div.className = "bingo-card";
                
                ['B','I','N','G','O'].forEach(l => {
                    var h = document.createElement('div');
                    h.className = "header-cell"; h.innerText = l;
                    div.appendChild(h);
                });

                card.forEach((n, i) => {
                    var cell = document.createElement('div');
                    cell.className = "num-cell"; cell.id = `c${cIdx}-${i}`;
                    
                    if(n === 0) {
                        cell.classList.add('marked', 'free');
                        cell.innerHTML = '<i class="fas fa-star text-yellow-600"></i>';
                    } else {
                        cell.innerText = n;
                        cell.onclick = function() { hit(cIdx, i, n); };
                    }
                    div.appendChild(cell);
                });
                wrap.appendChild(div);
            });
            area.appendChild(wrap);
        }

        function togglePlay() {
            if(S.game.pause) {
                S.game.pause = false;
                var btn = $('btn-play');
                btn.innerHTML = '<i class="fas fa-pause"></i> <span>PAUSAR</span>';
                btn.className = "flex-grow h-10 rounded-lg btn-yellow text-sm flex items-center justify-center gap-2 shadow-lg uppercase tracking-wide";
                
                if(S.game.drawn.length === 0) draw();
                S.game.timer = setInterval(draw, S.cfg.spd);
            } else { 
                stop(); 
                var btn = $('btn-play');
                btn.innerHTML = '<i class="fas fa-play"></i> <span>CONTINUAR</span>';
                btn.className = "flex-grow h-10 rounded-lg btn-action text-sm flex items-center justify-center gap-2 shadow-lg uppercase tracking-wide";
            }
        }

        function stop() {
            S.game.pause = true; clearInterval(S.game.timer);
        }

        function draw() {
            if(!S.game.active || (S.game.pause && S.game.timer)) return;
            if(S.game.drawn.length >= 75) { stop(); alert("Fim das pedras!"); return; }

            if(Math.random() < 0.2 && !$('game-msg').innerText.includes("⚠️")) {
                $('game-msg').innerText = phrases[Math.floor(Math.random()*phrases.length)];
                $('game-msg').className = "text-blue-100 text-[10px] uppercase tracking-widest font-bold";
            }

            setTimeout(function() {
                if(!S.game.active) return;
                var n; do { n = Math.floor(Math.random()*75)+1; } while(S.game.drawn.includes(n));
                S.game.drawn.push(n);

                var hist = $('ball-history');
                if(S.game.drawn.length === 1) hist.innerHTML = '';
                var prev = hist.querySelector('.latest');
                if(prev) prev.classList.remove('latest');

                var ballEl = document.createElement('div');
                ballEl.className = "ball-hist latest";
                ballEl.innerText = n;
                ballEl.animate([{ transform: 'scale(0)' }, { transform: 'scale(1)' }], { duration: 300 });

                hist.prepend(ballEl);
                
                playSound('draw');
                speak(n.toString());

                S.game.bots.forEach(b => {
                    if(b.needed > 0 && Math.random() < 0.22) { 
                        b.needed--;
                    }
                });
                updateRivalsUI();
                
                var winnerBot = S.game.bots.find(b => b.needed === 0);
                if(winnerBot) {
                    doEnd(false, winnerBot.name);
                }

            }, 500);
        }

        function hit(cIdx, i, n) {
            if(S.game.marks[cIdx][i]) return;
            var el = $(`c${cIdx}-${i}`);
            
            if(S.game.drawn.includes(n)) {
                S.game.marks[cIdx][i] = true;
                el.classList.add('marked');
                playSound('click');
                checkWin(cIdx);
            } else {
                el.classList.add('shake');
                setTimeout(() => el.classList.remove('shake'), 400);
                playSound('lose');
            }
        }

        function checkWin(cIdx) {
            var m = S.game.marks[cIdx];
            var r = $('sel-rule').value;
            var w = false;
            var _chk = function(arr) { return arr.every(function(x) { return m[x]; }); };

            if(r === 'line') {
                for(var k=0; k<5; k++) {
                    if(_chk([k*5, k*5+1, k*5+2, k*5+3, k*5+4])) w=true; 
                    if(_chk([k, k+5, k+10, k+15, k+20])) w=true;
                }
                if(_chk([0,6,12,18,24]) || _chk([4,8,12,16,20])) w=true;
            } else {
                if(m.every(function(x) { return x; })) w=true;
            }

            if(w) doEnd(true, S.name);
        }

        function doEnd(won, winnerName) {
            stop(); S.game.active = false;
            var border = $('modal-border');
            var title = $('end-title');
            var msg = $('end-msg');
            var pbox = $('prize-box');
            
            if(won) {
                var mult = $('sel-rule').value === 'full' ? 5 : 2;
                var prize = S.cfg.bet * mult;
                S.bal += prize; updUi();
                
                border.className = "bg-blue-900 border-4 border-yellow-500 rounded-2xl p-6 text-center max-w-xs w-full shadow-2xl relative overflow-hidden";
                title.innerText = "BINGO!";
                title.className = "text-5xl text-yellow-400 vegas-font mb-2";
                msg.innerText = "Parabéns, " + S.name + "!";
                pbox.style.display = "block";
                $('win-amount').innerText = prize;
                playSound('win');
            } else {
                border.className = "bg-red-900 border-4 border-red-500 rounded-2xl p-6 text-center max-w-xs w-full shadow-2xl relative overflow-hidden";
                title.innerText = "DERROTA";
                title.className = "text-4xl text-red-500 vegas-font mb-2";
                msg.innerText = winnerName + " bateu o Bingo!";
                pbox.style.display = "none";
                playSound('lose');
            }
            
            $('modal-end').classList.remove('hidden');
        }

        function closeEnd() {
            $('modal-end').classList.add('hidden');
            switchScr('screen-config');
        }

        function quit() {
            if(confirm('Sair agora?')) {
                stop(); window.speechSynthesis.cancel();
                switchScr('screen-config');
            }
        }
    </script>
</body>
</html>
